name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Build as nightly (pre-release)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  MOD_NAME: MultiEnchantmentMod
  DOTNET_VERSION: '9.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: supabase
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The game DLL is needed for compilation but not shipped.
      # CI uses a cached copy uploaded as a repository secret or artifact.
      - name: Restore game DLL from cache
        uses: actions/cache@v4
        id: cache-gamedll
        with:
          path: .ci/gamedlls
          key: sts2-dlls-${{ hashFiles('.ci/dll-version.txt') }}

      - name: Verify game DLLs exist
        if: steps.cache-gamedll.outputs.cache-hit != 'true'
        run: |
          echo "::error::Game DLLs not found in cache. Run the seed-cache workflow first or manually upload."
          echo "See .github/README.md for instructions on seeding the game DLL cache."
          exit 1

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          dotnet publish MultiEnchantmentMod.csproj -c Release \
            -p:Sts2DataDir=${{ github.workspace }}/.ci/gamedlls \
            -p:GodotPath= \
            -p:ModsPath= \
            -p:SupabaseUrl="${SUPABASE_URL}" \
            -p:SupabaseAnonKey="${SUPABASE_ANON_KEY}"

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=nightly-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package mod
        run: |
          VERSION=${{ steps.version.outputs.version }}
          STAGE="_release/${{ env.MOD_NAME }}"
          rm -rf _release && mkdir -p "$STAGE"

          # DLL from publish output
          DLL=$(find . -path '*/publish/${{ env.MOD_NAME }}.dll' -print -quit)
          if [ -z "$DLL" ]; then
            echo "::error::${{ env.MOD_NAME }}.dll not found in publish output"
            find . -name '*.dll' -path '*/publish/*' || true
            exit 1
          fi
          cp "$DLL" "$STAGE/"

          # Mod manifest
          cp ${{ env.MOD_NAME }}.json "$STAGE/"

          cd _release
          zip -r "../${{ env.MOD_NAME }}-${VERSION}.zip" "${{ env.MOD_NAME }}/"
          cd ..
          echo "ZIP_PATH=${{ env.MOD_NAME }}-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${{ env.MOD_NAME }}-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || inputs.nightly == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true

  upload-nexus:
    needs: build
    runs-on: ubuntu-latest
    environment: supabase
    if: github.ref_type == 'tag'  # Only upload to NexusMods on tagged releases
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-package

      - name: Determine Nexus upload metadata
        id: nexus
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_FILE="${{ env.MOD_NAME }}-${GITHUB_REF_NAME}.zip"
          MIN_GAME_VERSION=$(jq -r '.min_game_version' "${{ env.MOD_NAME }}.json")
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ls -lh "$ZIP_FILE"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_file=${ZIP_FILE}" >> "$GITHUB_OUTPUT"
          {
            echo "description<<EOF"
            echo "Requires game version ${MIN_GAME_VERSION} or newer."
            echo ""
            echo "GitHub Release: ${RELEASE_URL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to NexusMods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.7
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUS_FILE_GROUP_ID }}
          filename: ${{ steps.nexus.outputs.zip_file }}
          version: ${{ steps.nexus.outputs.version }}
          display_name: ${{ env.MOD_NAME }} ${{ github.ref_name }}
          description: ${{ steps.nexus.outputs.description }}
          file_category: main
          archive_existing_file: false
          allow_mod_manager_download: true

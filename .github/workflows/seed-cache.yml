name: Seed Game DLL Cache

# Run manually to upload game DLLs into the Actions cache.
# After running, the main release workflow can build without the game installed.
#
# Usage: commit DLLs to .ci/gamedlls/, push, trigger this workflow,
#        then remove DLLs from git (they stay in the cache).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify DLLs exist in repo
        run: |
          for dll in sts2.dll 0Harmony.dll; do
            if [ ! -f ".ci/gamedlls/$dll" ]; then
              echo "::error::$dll not found in .ci/gamedlls/. Commit it first."
              exit 1
            fi
          done
          echo "Found DLLs:"
          ls -lh .ci/gamedlls/

      - name: Save to cache
        uses: actions/cache/save@v4
        with:
          path: .ci/gamedlls
          key: sts2-dlls-${{ hashFiles('.ci/dll-version.txt') }}
